<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <title>{% block title%} {% endblock %}</title>
     <style>
       {% block css %} 
       .navbar .form-control {
    border-radius: 20px;
}

.navbar .btn {
    border-radius: 20px;
}

#popcart {
    position: relative;
}
{% endblock %}
  </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="/shop">My Awesome Cart</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">

  <!-- LEFT MENU -->
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" href="/shop">Home</a>
    </li>

    <li class="nav-item">
      <a class="nav-link" href="/shop/tracker">Tracker</a>
    </li>

    <li class="nav-item active">
      <a class="nav-link" href="/blog">Blog</a>
    </li>

    <li class="nav-item">
      <a class="nav-link" href="/shop/about">About Us</a>
    </li>

    <li class="nav-item">
      <a class="nav-link" href="/shop/contact">Contact Us</a>
    </li>
  </ul>

  <!-- RIGHT SIDE (SEARCH + CART + PROFILE) -->
  <div class="ml-auto d-flex align-items-center">

    <!-- SEARCH -->
    <form method="get" action="/shop/search/" class="form-inline mr-3">
      <input class="form-control form-control-sm mr-2"
             type="search"
             name="search"
             placeholder="Search"
             aria-label="Search">
      <button class="btn btn-outline-light btn-sm" type="submit">
        Search
      </button>
    </form>

    <!-- CART BUTTON -->
    <button id="popcart"
            class="btn btn-outline-light btn-sm d-flex align-items-center"
            data-container="body"
            data-toggle="popover"
            data-placement="bottom"
            data-html="true"
            data-content="Your cart">

      <svg width="18" height="18" viewBox="0 0 16 16" class="mr-1" fill="currentColor">
        <path d="M0 1.5A.5.5 0 0 1 .5 1h1a.5.5 0 0 1 .485.379L2.89 5H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 14H4a.5.5 0 0 1-.491-.408L1.01 2H.5a.5.5 0 0 1-.5-.5z"/>
        <path d="M5 12a1 1 0 1 0 0 2"/>
        <path d="M11 12a1 1 0 1 0 0 2"/>
      </svg>

      <span id="cart" class="badge badge-light ml-1">0</span>
    </button>
      <div class="dropdown">
        <a class="nav-link dropdown-toggle text-light p-0 mx-2" href="#" id="userMenu" data-toggle="dropdown"
           aria-haspopup="true" aria-expanded="false" aria-label="Account: {{ request.user.first_name|default:request.user.username|capfirst }}">
          <span class="rounded-circle bg-light text-dark d-inline-flex align-items-center justify-content-center"
                style="width:34px;height:34px;font-weight:600;">
            {{ request.user.first_name|default:request.user.username|slice:":1"|upper }}
          </span>
        </a>
        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userMenu">
          <a class="dropdown-item" href="#">Profile</a>          <a class="dropdown-item" href="/shop/orders/">My Orders</a>          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="{% url 'Logout' %}">Logout</a>
        </div>
      </div>

   
    

  </div>
</div>

    </ul>
    <!-- <form class="form-inline my-2 my-lg-0">
      <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
      <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
    </form> -->
    <!-- <button type="button" class="btn btn-secondary mx-2" id="popcart" data-container="body" data-toggle="popover" data-placement="bottom" data-html="true" data-content="Vivamus
sagittis lacus vel augue laoreet rutrum faucibus.">


  Cart(<span id="cart">0</span>)
</button> -->
  </div>
</nav>
  {% block body %} {% endblock %}

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.js"
  integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="
  crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js" integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous"></script>
    {% block js %} {% endblock %}
  </body>
</html>
